api_version = "2026-10"

[[extensions]]
name = "bogo-nudge"
handle = "bogo-nudge"
type = "ui_extension"
uid = "9106be2c-2c0c-4d95-9f49-cc7452bed46f61f7a622"

# Buy X get Y config, also read by the bogo-discount Function.
[[extensions.metafields]]
namespace = "$app"
key = "bogo_config"
owner_type = "SHOP"

# Under each line item: "Add 1 more — it's free" / "1 free with Buy 2, get 1".
[[extensions.targeting]]
module = "./src/Nudge.tsx"
target = "purchase.checkout.cart-line-item.render-after"
