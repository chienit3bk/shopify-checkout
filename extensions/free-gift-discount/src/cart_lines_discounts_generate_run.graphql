query CartInput($giftCollectionIds: [ID!]) {
  # Cart amounts are in the buyer's currency; rule amounts are in the shop's (plus optional per-market overrides).
  presentmentCurrencyRate
  cart {
    cost {
      subtotalAmount {
        currencyCode
      }
    }
    lines {
      id
      quantity
      cost {
        subtotalAmount {
          amount
        }
      }
      giftRule: attribute(key: "_free_gift") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            # $giftCollectionIds comes from the discount's input-variables metafield (gift_collection_in_cart).
            inGiftCollection: inAnyCollection(ids: $giftCollectionIds)
          }
        }
      }
    }
  }
  shop {
    # No namespace = the app-reserved namespace ($app), so only this app can write it.
    config: metafield(key: "free_gift_config") {
      jsonValue
    }
  }
  discount {
    discountClasses
  }
}
