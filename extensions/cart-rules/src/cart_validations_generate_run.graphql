query CartValidationsGenerateRunInput {
  buyerJourney {
    step
  }
  presentmentCurrencyRate
  cart {
    buyerIdentity {
      # B2B rules apply when buying for a company location; first-order minimum uses its history.
      purchasingCompany {
        location {
          ordersCount
        }
      }
      customer {
        numberOfOrders
      }
      # A guest's email can name anyone's account; order history counts only when signed in.
      isAuthenticated
    }
    cost {
      # The "Subtotal" the buyer sees: after item discounts, before order discounts.
      subtotalAmount {
        amount
        currencyCode
      }
    }
    lines {
      quantity
      cost {
        # After item discounts, so a free "buy 2 get 1" unit counts as 0.
        totalAmount {
          amount
        }
      }
      # Gift lines never count (free-gift block).
      giftRule: attribute(key: "_free_gift") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
            title
          }
        }
      }
    }
  }
  shop {
    # App-owned rules (scripts/cart-rules-config.json).
    config: metafield(key: "cart_rules_config") {
      jsonValue
    }
  }
}
