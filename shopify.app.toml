# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "07bbe0cc3b4d6166d15241b0b4434abb"
name = "Clark Checkout Demos"
application_url = "https://shopify.dev/apps/default-app-home"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-10"

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_discounts,write_orders,write_pixels,read_customer_events,write_validations"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

# "How did you hear about us?" — written to a cart metafield in checkout and copied onto the order.
[order.metafields.app.attribution]
name = "How did you hear about us?"
type = "single_line_text_field"
capabilities.cart_to_order_copyable = true

  [order.metafields.app.attribution.access]
  admin = "merchant_read"
