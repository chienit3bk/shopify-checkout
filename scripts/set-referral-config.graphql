# Writes {code, percentOff} for the thank-you referral block.
mutation SetReferralConfig($shopId: ID!, $config: String!) {
  metafieldsSet(metafields: [{ownerId: $shopId, namespace: "$app", key: "referral_config", type: "json", value: $config}]) {
    metafields { key updatedAt }
    userErrors { field message }
  }
}
