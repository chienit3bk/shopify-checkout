# Writes scripts/tiers-config.json to the app-owned shop metafield (Function + both checkout blocks).
# shopify app execute --store <shop> --query-file scripts/set-tiers-config.graphql --variable-file <vars.json>
mutation SetTiersConfig($shopId: ID!, $config: String!) {
  metafieldsSet(metafields: [{ownerId: $shopId, namespace: "$app", key: "tiers_config", type: "json", value: $config}]) {
    metafields { key updatedAt }
    userErrors { field message }
  }
}
