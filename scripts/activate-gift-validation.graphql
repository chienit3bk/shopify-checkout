# Turns on the gift-validation Function for the store (once per install).
# Run: shopify app execute --store <shop> --query-file scripts/activate-gift-validation.graphql
mutation ActivateGiftValidation {
  validationCreate(validation: {functionHandle: "gift-validation", title: "Free gift check", enable: true, blockOnFailure: false}) {
    validation { id title enabled }
    userErrors { field message code }
  }
}
