# Writes scripts/delivery-rules-config.json to the app-owned shop metafield read by delivery-customization.
# shopify app execute --store <shop> --query-file scripts/set-delivery-rules.graphql --variable-file <vars.json>
mutation SetDeliveryRules($shopId: ID!, $config: String!) {
  metafieldsSet(metafields: [{ownerId: $shopId, namespace: "$app", key: "delivery_rules_config", type: "json", value: $config}]) {
    metafields { key updatedAt }
    userErrors { field message }
  }
}
