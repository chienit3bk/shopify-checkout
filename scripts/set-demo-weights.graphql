# Sets realistic shipping weights on the Solvane demo catalog (for weight-based delivery rules).
# shopify store execute --store <shop> --allow-mutations --query-file scripts/set-demo-weights.graphql
mutation SetDemoWeights {
  w0: productVariantsBulkUpdate(productId: "gid://shopify/Product/10490410500378", variants: [{id: "gid://shopify/ProductVariant/53265035952410", inventoryItem: {measurement: {weight: {value: 200, unit: GRAMS}}}}]) { userErrors { field message } }
  w1: productVariantsBulkUpdate(productId: "gid://shopify/Product/10490410533146", variants: [{id: "gid://shopify/ProductVariant/53265035985178", inventoryItem: {measurement: {weight: {value: 250, unit: GRAMS}}}}]) { userErrors { field message } }
